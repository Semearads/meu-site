<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Semear Ads | Agenda Lotada</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050816;
    }

    body {
      font-family: 'Manrope', 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #F5F7FB;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    input, button, textarea, select { font: inherit; }

    .progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      z-index: 1000;
      background: linear-gradient(90deg, #D4AF37, #8B6E1F, #D4AF37);
      background-size: 200% auto;
      animation: shimmer 3s linear infinite;
      transition: width .6s ease;
    }

    .fs-btn {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      background: rgba(255,255,255,.04);
      color: #7E879B;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
      transition: all .3s ease;
    }

    .fs-btn:hover {
      background: rgba(255,255,255,.08);
      color: #F5F7FB;
      border-color: rgba(212,175,55,.3);
    }

    .fs-btn svg { width: 14px; height: 14px; }

    .sc {
      position: fixed;
      bottom: 24px;
      left: 16px;
      z-index: 998;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 10px;
      background: rgba(0,0,0,.3);
      color: #7E879B;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .05em;
      backdrop-filter: blur(6px);
    }

    .sc .cn { color: #D4AF37; font-weight: 800; }

    .ind {
      position: fixed;
      bottom: 24px;
      left: 50%;
      z-index: 998;
      display: flex;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.05);
      border-radius: 20px;
      background: rgba(0,0,0,.3);
      transform: translateX(-50%);
      backdrop-filter: blur(8px);
    }

    .ind .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,.15);
      cursor: pointer;
      transition: all .4s ease;
    }

    .ind .dot.active {
      width: 28px;
      border-radius: 5px;
      background: #D4AF37;
      box-shadow: 0 0 10px rgba(212,175,55,.6);
    }

    .nav-arr {
      position: fixed;
      right: 16px;
      bottom: 20px;
      z-index: 998;
      display: flex;
      gap: 8px;
    }

    .nav-arr button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      color: #AAB3C5;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all .3s ease;
    }

    .nav-arr button svg { width: 18px; height: 18px; }

    .nav-arr button:hover {
      background: rgba(212,175,55,.2);
      border-color: rgba(212,175,55,.4);
      color: #fff;
      transform: scale(1.05);
    }

    .presentation { width: 100vw; height: 100vh; overflow: hidden; }

    .slides {
      display: flex;
      height: 100%;
      transition: transform .7s cubic-bezier(.22,1,.36,1);
    }

    .slide {
      position: relative;
      display: flex;
      flex: 0 0 100vw;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #0A0F24 0%, #070B1D 45%, #050816 100%);
    }

    .slide::before {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(900px 420px at 72% 18%, rgba(212,175,55,.14) 0%, transparent 42%),
        radial-gradient(800px 380px at 35% 20%, rgba(212,175,55,.12) 0%, transparent 42%),
        linear-gradient(180deg, #0F0E08 0%, #0B0A06 45%, #050504 100%);
      content: '';
      pointer-events: none;
    }

    .slide::after {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: radial-gradient(rgba(255,255,255,.06) .8px, transparent .8px);
      background-size: 24px 24px;
      content: '';
      opacity: .3;
      pointer-events: none;
    }

    .slide > * { position: relative; z-index: 1; }

    .slide-center {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 72px 20px 100px;
    }

    .gt {
      background: linear-gradient(135deg, #FFD700 0%, #D4AF37 50%, #FFD700 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      padding: 8px 16px;
      border: 1px solid rgba(212,175,55,.3);
      border-radius: 999px;
      background: rgba(212,175,55,.08);
      color: #E8C65C;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .05em;
      text-align: center;
      text-transform: uppercase;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 28px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #E8C65C, #B8860B);
      box-shadow: 0 12px 36px rgba(212,175,55,.35);
      color: #000;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .01em;
      text-decoration: none;
      transition: all .3s ease;
      white-space: nowrap;
    }

    .cta-btn:hover {
      box-shadow: 0 20px 48px rgba(212,175,55,.5);
      transform: scale(1.04) translateY(-2px);
    }

    .cta-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes logoPulse {
      0%, 100% { opacity: .55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.07); }
    }

    .logo-wrap {
      position: relative;
      display: inline-block;
      padding: 10px;
      border: 1px solid rgba(212,175,55,.35);
      border-radius: 32px;
      background: rgba(255,255,255,.05);
      box-shadow:
        0 20px 60px rgba(0,0,0,.5),
        0 0 45px rgba(212,175,55,.28),
        0 0 90px rgba(212,175,55,.16),
        inset 0 1px 0 rgba(255,255,255,.08);
      animation: logoFloat 5s ease-in-out infinite;
    }

    .logo-wrap::after {
      position: absolute;
      inset: -12px;
      z-index: -1;
      border-radius: 40px;
      background: radial-gradient(60% 60% at 50% 50%, rgba(212,175,55,.28) 0%, rgba(212,175,55,.16) 45%, transparent 72%);
      content: '';
      filter: blur(8px);
      animation: logoPulse 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    .logo-img {
      display: block;
      width: 100%;
      max-width: 240px;
      height: auto;
      margin: 0 auto;
      border-radius: 24px;
    }

    .slide.active .au { animation: fadeUp .7s ease both; }

    .d1 { animation-delay: .10s !important; }
    .d2 { animation-delay: .22s !important; }
    .d3 { animation-delay: .34s !important; }
    .d4 { animation-delay: .46s !important; }
    .d5 { animation-delay: .58s !important; }

    .s1-wrap {
      width: 100%;
      max-width: 880px;
      text-align: center;
    }

    .s1-title {
      margin: 0 0 12px;
      color: #F5F7FB;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 600;
      letter-spacing: -.01em;
      line-height: 1.08;
      text-align: center;
      text-wrap: balance;
    }

    .s1-title .gt { font-weight: 700; }

    .s1-sub,
    .s1-wrap .badge,
    .s1-wrap .cta-btn {
      font-family: 'Manrope', sans-serif;
    }

    .s1-sub {
      max-width: 560px;
      margin: 0 auto;
      color: #AAB3C5;
      font-size: clamp(13px, 1.8vw, 16px);
      letter-spacing: .01em;
      line-height: 1.55;
    }

    .s1-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    @media (max-width: 768px) {
      .slide-center { padding: 80px 16px 110px; }
      .sc { bottom: 16px; left: 10px; padding: 6px 10px; font-size: 11px; }
      .ind { bottom: 16px; gap: 5px; padding: 6px 10px; }
      .ind .dot { width: 7px; height: 7px; }
      .ind .dot.active { width: 22px; }
      .nav-arr { right: 10px; bottom: 12px; gap: 6px; }
      .nav-arr button { width: 38px; height: 38px; border-radius: 10px; }
      .nav-arr button svg { width: 16px; height: 16px; }
    }

    @media (max-width: 640px) {
      .fs-btn { display: none; }
      .slide-center { padding: 80px 14px 120px; }
      .s1-wrap { padding: 0 4px; }
      .logo-img { max-width: 180px; }

      .s1-title {
        margin-bottom: 10px;
        font-size: 26px;
        line-height: 1.08;
      }

      .s1-sub { margin-bottom: 4px; font-size: 13px; line-height: 1.55; }
      .s1-stack { gap: 10px; }
      .badge { margin-bottom: 16px; padding: 7px 12px; font-size: 10px; }
    }

    @media (max-width: 380px) {
      .slide-center { padding: 90px 12px 130px; }
      .logo-img { max-width: 160px; }
      .s1-title { font-size: 23px; }
      .s1-sub { font-size: 12px; }
    }

    @media (max-width: 340px) {
      .slide-center { padding: 72px 10px 110px; }
      .logo-img { max-width: 140px; }
      .s1-title { font-size: 21px; }
      .s1-sub { font-size: 11px; }
    }
  </style>
</head>

<body>
  <div class="progress" id="prog" style="width:100%"></div>

  <button class="fs-btn" onclick="toggleFs()" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
    </svg>
    <span id="fsTxt">Tela cheia</span>
  </button>

  <div class="sc"><span class="cn" id="cn">1</span> / 1</div>
  <div class="ind" id="ind"></div>

  <div class="presentation">
    <div class="slides" id="sw">
      <section class="slide active">
        <div class="slide-center">
          <div class="s1-wrap">
            <div class="s1-stack">
              <div class="au d1">
                <div class="logo-wrap">
                  <img src="img/logosemearads.png" alt="Logo Semear Ads" class="logo-img">
                </div>
              </div>

              <h2 class="au d2 s1-title">
                SUA AGENDA <span class="gt">LOTADA COMEÇA AQUI</span>
              </h2>

              <p class="au d3 s1-sub">
                Pare de depender de indicação e aprenda a atrair clientes todos os dias pelo marketing digital.
              </p>

              <p class="au d3 s1-sub">
                Profissionais da beleza e estética lotam a agenda com o Semear Ads.
              </p>

              <div class="badge au d4">Instagram que vende · Tráfego pago · Conteúdo que atrai</div>

              <a href="https://wa.me/5511910832222?text=Olá,%20quero%20lotar%20minha%20agenda!" target="_blank" rel="noopener" class="cta-btn au d5"
                 style="animation:none;white-space:normal;text-align:center;max-width:90%">
                QUERO LOTAR MINHA AGENDA
              </a>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    const T = 1;
    let C = 0;

    const W = document.getElementById('sw');
    const CN = document.getElementById('cn');
    const Ind = document.getElementById('ind');

    for (let i = 0; i < T; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === 0) dot.classList.add('active');
      dot.onclick = () => go(i);
      Ind.appendChild(dot);
    }

    function upd() {
      Ind.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === C);
      });
      CN.textContent = C + 1;
    }

    function go(i) {
      if (i < 0 || i >= T) return;
      C = i;
      W.style.transform = `translateX(-${C * 100}vw)`;
      upd();
    }

    function toggleFs() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const text = document.getElementById('fsTxt');
      if (text) text.textContent = document.fullscreenElement ? 'Sair' : 'Tela cheia';
    });

    upd();
  </script>
</body>
</html>
